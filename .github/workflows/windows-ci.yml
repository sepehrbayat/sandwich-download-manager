name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The engine lifecycle tests drive a real aria2c; without it they skip rather than fail,
      # so install it to keep that coverage meaningful in CI.
      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Formatting
        run: cargo fmt --all --check

      # The desktop crate's build script stages the browser bridge into the bundle resources
      # and Tauri verifies the resource exists on every compile — including the test build.
      # Locally the release bridge is always around from earlier builds; a fresh runner has
      # to create it first, in the same order the real installer build does.
      - name: Build browser bridge
        run: cargo build --release -p sandwich-browser-host

      - name: Tests
        run: cargo test --workspace

      - name: Frontend tests
        # PowerShell does not expand globs, so the pattern reached node verbatim and it found
        # nothing. bash matches how this is run locally, which is the point of the check.
        shell: bash
        run: node --test tests/frontend/*.test.js

      - name: Install UI test runner
        # Only the Playwright package: the tests drive the Edge that windows-latest already
        # ships, so no browser download is needed. That is also the engine the app renders in,
        # since WebView2 is Edge.
        run: npm ci --no-fund --no-audit

      - name: UI tests
        run: npx playwright test

      - name: Upload UI test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Build installers
        # Both kinds of signing are opt-in, so forks and pull requests build instead of
        # failing on secrets they cannot read.
        #   - Updater signing: the minisign private key stays on the release machine
        #     (SIGNING.md). With a pubkey in the config Tauri refuses to build updater
        #     artifacts unsigned, so a keyless build turns them off — this is a
        #     verification build, not a release.
        #   - Authenticode: same pattern as before via the thumbprint secret.
        run: |
          $configs = @("--config", "apps/desktop/tauri.conf.json")
          $updaterKey = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if ($updaterKey) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $updaterKey
          } else {
            $configs += @("--config", '{"bundle":{"createUpdaterArtifacts":false}}')
          }
          $thumbprint = "${{ secrets.SIGNING_CERT_THUMBPRINT }}"
          if ($thumbprint) {
            # Tauri does not expand environment variables inside config files, so the
            # thumbprint is supplied as inline JSON rather than a placeholder.
            $configs += @("--config", "apps/desktop/tauri.signing.conf.json")
            $configs += @("--config", ('{"bundle":{"windows":{"certificateThumbprint":"' + $thumbprint + '"}}}'))
          }
          npx --yes @tauri-apps/cli@2 build @configs

      - uses: actions/upload-artifact@v4
        with:
          name: sandwich-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
