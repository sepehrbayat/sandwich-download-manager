name: Release

# Release builds are created from a tagged commit on clean GitHub runners. Updater signatures,
# Apple credentials, and optional Windows code-signing credentials live only in repository
# secrets. A dry run exercises the same signed updater pipeline without publishing anything.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing a release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the permanent updater signing key
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_KEY) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is not configured. Do not create or rotate it; provision the existing permanent key described in SIGNING.md."
            exit 1
          }

      - name: Check tag and package version parity
        id: version
        run: |
          $configured = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $versions = [ordered]@{
            desktop_crate = (Select-String apps/desktop/Cargo.toml '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
            package = (Get-Content package.json -Raw | ConvertFrom-Json).version
            chromium = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
            firefox = (Get-Content extension/manifest.firefox.json -Raw | ConvertFrom-Json).version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $configured) {
              Write-Error "$($entry.Key) version $($entry.Value) does not match desktop version $configured"
              exit 1
            }
          }
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$configured" }
          if (($tag -replace '^v', '') -ne $configured) {
            Write-Error "tag $tag does not match configured version $configured"
            exit 1
          }
          Add-Content $env:GITHUB_OUTPUT "version=$configured"
          Add-Content $env:GITHUB_OUTPUT "tag=v$configured"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install integration-test dependencies
        run: |
          choco install aria2 --no-progress -y
          npm ci --no-fund --no-audit

      - name: Build the browser bridge
        run: cargo build --release -p sandwich-browser-host

      - name: Full verification
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          npm test
          npm run test:extension
          npm run package:extension
          npx playwright test

      - uses: actions/upload-artifact@v4
        with:
          name: sandwich-release-extensions
          path: dist/sandwich-extension-*.zip
          if-no-files-found: error
          retention-days: 14

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: sandwich-release-windows
          - os: ubuntu-22.04
            platform: linux
            artifact: sandwich-release-linux
          - os: macos-15
            platform: macos
            artifact: sandwich-release-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb

      - name: Install macOS download engine
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Install Windows download engine
        if: runner.os == 'Windows'
        run: choco install aria2 --no-progress -y

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage Unix download engine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then engine=/usr/bin/aria2c; else engine=/opt/homebrew/bin/aria2c; fi
          install -m 755 "$engine" apps/desktop/binaries/aria2c

      - name: Build browser bridge
        run: cargo build --release -p sandwich-browser-host

      - name: Prepare Apple signing identity
        if: runner.os == 'macOS'
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "A final macOS release requires APPLE_CERTIFICATE and notarization credentials." >&2
              exit 1
            fi
            overlay="$RUNNER_TEMP/macos-adhoc.conf.json"
            printf '%s\n' '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > "$overlay"
            echo "overlay=$overlay" >> "$GITHUB_OUTPUT"
            echo "Using an ad-hoc identity for this inspection-only dry run."
            exit 0
          fi
          for required in APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required}" ]; then echo "$required is required when APPLE_CERTIFICATE is configured" >&2; exit 1; fi
          done
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build Windows release packages
        if: runner.os == 'Windows'
        run: |
          $configs = @(
            "--config", "apps/desktop/tauri.conf.json",
            "--config", "apps/desktop/tauri.windows.conf.json"
          )
          $thumbprint = "${{ secrets.SIGNING_CERT_THUMBPRINT }}"
          if ($thumbprint) {
            $identity = Join-Path $env:RUNNER_TEMP "authenticode.conf.json"
            @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint } } } |
              ConvertTo-Json -Depth 4 | Set-Content $identity -Encoding ascii
            $configs += @("--config", "apps/desktop/tauri.signing.conf.json", "--config", $identity)
          } else {
            Write-Host "::notice::Authenticode is not configured; updater signatures and published checksums still protect update integrity."
          }
          npx --yes @tauri-apps/cli@2 build @configs

      - name: Build Linux release packages
        if: runner.os == 'Linux'
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --config apps/desktop/tauri.conf.json --config apps/desktop/tauri.linux.conf.json

      - name: Build macOS release packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          configs=(--config apps/desktop/tauri.conf.json --config apps/desktop/tauri.macos.conf.json)
          if [ -n "${{ steps.apple.outputs.overlay }}" ]; then configs+=(--config "${{ steps.apple.outputs.overlay }}"); fi
          npx --yes @tauri-apps/cli@2 build "${configs[@]}"

      - name: Verify and smoke Windows installed package
        if: runner.os == 'Windows'
        run: |
          $setup = @(Get-ChildItem "target/release/bundle/nsis/*_${{ needs.preflight.outputs.version }}_x64-setup.exe")
          if ($setup.Count -ne 1 -or -not (Test-Path "$($setup[0].FullName).sig")) {
            Write-Error "Windows updater executable/signature pair is incomplete"
            exit 1
          }
          $installer = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer exited $($installer.ExitCode)" }
          powershell -ExecutionPolicy Bypass -File tests/quality/smoke-installed.ps1

      - name: Verify and smoke Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage="$(find target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage" && test -s "$appimage.sig"
          mkdir -p /tmp/sandwich-deb
          dpkg-deb --extract target/release/bundle/deb/*.deb /tmp/sandwich-deb
          find /tmp/sandwich-deb -type f -name aria2c -print -quit | grep .
          find /tmp/sandwich-deb -type f -name sandwich-browser-host -print -quit | grep .
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a "$appimage" >/tmp/sandwich-appimage.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then cat /tmp/sandwich-appimage.log; exit 1; fi

      - name: Verify and smoke macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          archive="$(find target/release/bundle/macos -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$app" && test -s "$archive" && test -s "$archive.sig"
          codesign --verify --deep --strict "$app"
          find "$app/Contents/Resources" -type f -name aria2c -print -quit | grep .
          find "$app/Contents/Resources" -type f -name sandwich-browser-host -print -quit | grep .
          executable="$(find "$app/Contents/MacOS" -type f -perm +111 -print -quit)"
          "$executable" >/tmp/sandwich-macos.log 2>&1 & pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/sandwich-macos.log; exit 1; fi
          kill "$pid" && wait "$pid" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: sandwich-release-*
          path: release-assets
          merge-multiple: true

      - name: Author and validate multi-platform updater manifest
        shell: pwsh
        run: |
          ./tools/make-latest-json.ps1 `
            -Version "${{ needs.preflight.outputs.version }}" `
            -Repo "${{ github.repository }}" `
            -Notes "$(git log -1 --pretty=%s)" `
            -ArtifactRoot release-assets `
            -OutputPath release-assets/latest.json
          $bytes = [System.IO.File]::ReadAllBytes("release-assets/latest.json")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "latest.json contains a UTF-8 BOM"
          }
          $manifest = Get-Content release-assets/latest.json -Raw | ConvertFrom-Json
          $expected = @("windows-x86_64", "linux-x86_64", "darwin-aarch64")
          foreach ($platform in $expected) {
            $entry = $manifest.platforms.$platform
            if (-not $entry.url -or -not $entry.signature) { throw "latest.json is incomplete for $platform" }
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File |
            Where-Object Name -NotIn @("latest.json", "SHA256SUMS.txt") |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name.Replace(" ", ".") } |
            Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
          Get-Content release-assets/SHA256SUMS.txt

      - name: Upload release candidate for inspection
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: sandwich-${{ needs.preflight.outputs.version }}-release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag' && inputs.dry_run != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release create "${{ needs.preflight.outputs.tag }}" $assets `
            --title "Sandwich ${{ needs.preflight.outputs.version }}" `
            --notes "Built together with our GitHub contributors and dedicated to the global open-source community—to everyone seeking code freedom and digital justice." `
            --generate-notes
