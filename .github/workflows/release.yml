name: Release

# Releases are built here rather than on anyone's laptop, so the minisign private key lives in
# exactly one place: the repository secrets. That is also what makes a release reproducible —
# the artifact users install is built from a tagged commit by a machine with no local state.
#
# To publish through Actions: bump the version in apps/desktop/tauri.conf.json,
# apps/desktop/Cargo.toml and extension/manifest.json, merge, push a matching tag, then explicitly
# dispatch this workflow from that tag after the signing secret has been provisioned:
#
#   gh workflow run release.yml --ref v0.5.0 -f dry_run=false
#
# Tag pushes do not start this workflow automatically. This keeps a locally signed manual release
# from creating a guaranteed red run when the private updater key is intentionally not in GitHub.
#
# Everything below is a guard against the two ways a release goes quietly wrong: shipping an
# installer that installed copies will refuse, and shipping one they never hear about.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing a release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Without the key Tauri cannot produce updater artifacts at all, and a release published
      # without them is worse than no release: every installed copy polls latest.json, and one
      # that points at an unsigned artifact is rejected on arrival. v0.2.0 and v0.1.1 shipped
      # with no .sig files, so this is a mistake the project has already made once.
      - name: Require the updater signing key
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_KEY) {
            Write-Error @"
          TAURI_SIGNING_PRIVATE_KEY is not set on this repository.

          Every installed copy of Sandwich verifies an update's signature against the public key
          baked into the app, so an unsigned release cannot be installed by anyone — it can only
          make the update check fail. Add the secret (the CONTENTS of ~/.tauri/sandwich-updater.key
          on the release machine) under Settings -> Secrets and variables -> Actions, then re-run.

          Do not generate a replacement key: installed copies verify against the public key they
          shipped with, so rotating it locks every existing user out of all future updates. See
          SIGNING.md.
          "@
            exit 1
          }
          Write-Host "updater signing key is present"

      # A tag that disagrees with the version in the config produces a latest.json advertising a
      # version the installer does not carry. The updater then either offers an update that
      # reinstalls the same build, or never settles — and the only symptom is a user reporting
      # that the update "keeps coming back".
      - name: Check the tag matches the version in the config
        id: version
        run: |
          $configured = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$configured" }
          $tagged = $tag -replace '^v', ''
          if ($tagged -ne $configured) {
            Write-Error "tag $tag does not match apps/desktop/tauri.conf.json version $configured"
            exit 1
          }
          $crate = (Select-String -Path apps/desktop/Cargo.toml -Pattern '^version = "(.+)"' |
                     Select-Object -First 1).Matches[0].Groups[1].Value
          if ($crate -ne $configured) {
            Write-Error "apps/desktop/Cargo.toml is $crate but tauri.conf.json is $configured"
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$configured"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "tag=v$configured"
          Write-Host "releasing $configured"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The engine lifecycle tests skip themselves when aria2c is absent — reporting as passed
      # while covering nothing. A release must not be the build where that goes unnoticed.
      - name: Install aria2
        run: choco install aria2 --no-progress -y

      # Staged into the bundle resources by the desktop crate's build script, and Tauri checks
      # the resource exists on every compile, including the test build.
      - name: Build browser bridge
        run: cargo build --release -p sandwich-browser-host

      - name: Tests
        run: cargo test --workspace

      - name: Frontend tests
        shell: bash
        run: node --test tests/frontend/*.test.js

      - name: Install UI test runner
        run: npm ci --no-fund --no-audit

      - name: UI tests
        run: npx playwright test

      # Same --config-as-a-file discipline as the CI workflow: npx is a .cmd shim, and inline
      # JSON loses its quotes on the way through PowerShell's legacy quoting for batch files.
      - name: Build signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $configs = @(
            "--config", "apps/desktop/tauri.conf.json",
            "--config", "apps/desktop/tauri.windows.conf.json"
          )
          $thumbprint = "${{ secrets.SIGNING_CERT_THUMBPRINT }}"
          if ($thumbprint) {
            # Tauri does not expand environment variables inside config files, so the thumbprint
            # is written into a throwaway overlay at build time.
            $identity = Join-Path $env:RUNNER_TEMP "authenticode.conf.json"
            @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint } } } |
              ConvertTo-Json -Depth 4 | Set-Content -Path $identity -Encoding ascii
            $configs += @("--config", "apps/desktop/tauri.signing.conf.json")
            $configs += @("--config", $identity)
          } else {
            Write-Host "::notice::No Authenticode certificate configured; installers are unsigned and SmartScreen will warn on first run. Updater artifacts are signed regardless. See SIGNING.md."
          }
          npx --yes @tauri-apps/cli@2 build @configs

      # Belt and braces: the build is supposed to fail without a key, but a missing .sig here
      # means a release that silently breaks every installed copy's update check.
      - name: Verify the updater artifacts exist
        run: |
          $setup = "target/release/bundle/nsis/Sandwich Download Manager_${{ steps.version.outputs.version }}_x64-setup.exe"
          foreach ($required in @($setup, "$setup.sig")) {
            if (-not (Test-Path -LiteralPath $required)) {
              Write-Error "missing $required - the updater would have nothing to verify"
              exit 1
            }
          }
          Write-Host "installer and signature both present"

      - name: Author latest.json
        run: |
          # github.repository rather than the script's default, so a release built from a fork
          # advertises URLs on the repo it was actually published to.
          $notes = git log -1 --pretty=%s
          ./tools/make-latest-json.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Repo "${{ github.repository }}" `
            -Notes "$notes"

      # SIGNING.md commits the project to publishing checksums while installers stay
      # un-Authenticoded, so a cautious user can verify a download independently.
      - name: Checksums
        run: |
          $bundle = "target/release/bundle"
          Get-ChildItem -ErrorAction SilentlyContinue "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi" |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path "$bundle/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$bundle/SHA256SUMS.txt"

      - name: Publish the release
        if: github.ref_type == 'tag' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = "target/release/bundle"
          # latest.json must be attached to EVERY release: installed copies fetch it from
          # releases/latest/download/, so a release without one stops older installs hearing
          # about this update and every update after it.
          $assets = @(
            "$bundle/nsis/latest.json",
            "$bundle/SHA256SUMS.txt"
          ) + (Get-ChildItem -ErrorAction SilentlyContinue `
                 "$bundle/nsis/*-setup.exe", "$bundle/nsis/*-setup.exe.sig", `
                 "$bundle/msi/*.msi", "$bundle/msi/*.msi.sig" |
                 ForEach-Object { $_.FullName })
          gh release create "${{ steps.version.outputs.tag }}" $assets `
            --title "Sandwich ${{ steps.version.outputs.version }}" `
            --generate-notes

      - name: Upload build for inspection
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: sandwich-${{ steps.version.outputs.version }}-dry-run
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/latest.json
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
