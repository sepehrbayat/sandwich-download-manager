[package]
name = "sandwich-desktop"
version = "0.6.1"
edition = "2024"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
download-policy = { path = "../../packages/download-policy" }
aria2-client = { path = "../../packages/aria2-client" }
# The download window is written on the local wall clock, so the schedule needs a real
# timezone — including the DST transitions std has no notion of.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
